name: 每日更新

on:
  schedule:
    - cron: '30 23 * * 0-4'    # UTC 23:30 = 台北時間週一至週五 07:30
  workflow_dispatch:            # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 安裝套件
        run: pip install yfinance pandas numpy requests
      - name: 更新行情、新聞與摘要
        run: python update.py
      - name: 存回 GitHub（網頁會自動同步）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "每日資料更新"
          git push

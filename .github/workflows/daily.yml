name: 每日更新

on:
  schedule:
    - cron: '30 23 * * 0-4'    # UTC 23:30 = 台北時間週一至週五 07:30
  workflow_dispatch:            # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安裝套件
        run: pip install -r requirements.txt huggingface_hub
      - name: 更新行情、新聞與摘要
        run: python update.py
      - name: 存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "每日資料更新"
          git push
      - name: 上傳到 Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: python deploy_space.py
